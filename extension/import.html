<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>导入 X 文章草稿</title>
<style>
:root { color-scheme: light dark; font: 16px/1.6 system-ui, sans-serif; }
body { margin: 0; background: light-dark(#f4f6f8,#15191e); color: light-dark(#18212b,#eff3f7); }
main { max-width: 650px; margin: 60px auto; padding: 32px; border-radius: 16px; background: light-dark(white,#222932); }
h1 { font-size: 28px; margin: 0 0 8px; } p { margin: 8px 0 24px; } label { display: block; font-weight: 600; margin: 24px 0 8px; }
input { max-width: 100%; } button { padding: 12px 20px; font: inherit; border-radius: 8px; border: 1px solid #8b99a5; cursor: pointer; }
#import { background: #116ab5; color: white; border: 0; margin-top: 28px; } button:disabled { opacity: .5; cursor: default; }
#status { white-space: pre-wrap; overflow-wrap: anywhere; padding-top: 20px; } #details,#folder-name { overflow-wrap: anywhere; }
a { color: light-dark(#0869bc,#8dc5ff); } small { display: block; margin-top: 8px; } [hidden] { display: none !important; }
@media(max-width:720px) { main { margin: 16px; padding: 24px; } }
</style>
<script src="shared.js" defer></script><script src="article.js" defer></script><script src="import.js" defer></script>
</head>
<body><main>
<h1>导入 X 文章草稿</h1>
<p>选一篇 Markdown，标题、正文和图片一起导入。检查后，由你在 X 手动发布。</p>
<label for="markdown">选择 Markdown 文件</label>
<input id="markdown" type="file" accept=".md,.markdown,.mdown,.mkd,.txt,text/markdown,text/plain">
<p id="details"></p>
<section id="folder-section" hidden>
<label for="folder">这篇文章含本地图片</label>
<button id="folder" type="button">选择附件文件夹</button>
<span id="folder-name"></span>
<small>选择能按原文相对路径找到图片的文件夹，通常是 Markdown 所在文件夹或 Obsidian 知识库根目录。仅授权读取。</small>
</section>
<button id="import" type="button" disabled>导入 X 草稿</button>
<small>首次使用某个图床时，Chrome 会提示访问授权。需要已登录 X，并具有 Articles 使用资格。</small>
<div id="status" role="status" aria-live="polite"></div>
<a id="draft" href="https://x.com/compose/articles/new" target="_blank" rel="noopener" hidden>查看 X 草稿</a>
</main></body></html>
